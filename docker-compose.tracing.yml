# Local trace viewer. Start it with:  docker compose -f docker-compose.tracing.yml up -d
# Then set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 in .env, restart the app, and open http://localhost:16686
services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # web UI
      - "4318:4318"     # OTLP over HTTP (what the app sends to)
