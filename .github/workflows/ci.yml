name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (no database, no model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # The unit tests import these packages, so torch and the models are not needed here.
      # numpy is used by the embedder and flashrank by the reranker (the tests only load their code, not the models).
      # fastapi, pydantic, bcrypt, PyJWT, pgvector and python-multipart are needed because some tests import app.main.
      - name: Install test dependencies
        run: pip install pytest httpx==0.28.1 "psycopg[binary]==3.3.6" python-dotenv==1.0.1 numpy==2.5.4 FlashRank==0.2.9 fastapi==0.111.0 starlette==0.37.2 pydantic==2.7.1 bcrypt==5.0.0 PyJWT==2.15.1 pgvector==0.5.1 python-multipart==0.0.32
      - name: Run unit tests
        run: python -m pytest -q tests

  web-build:
    name: Web interface (lint and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  access-checks:
    name: Access-control checks (real Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_ci_password
          POSTGRES_DB: knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d knowledge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app_ci_password@localhost:5432/knowledge
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (CPU-only torch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1
      - name: Create the database schema
        run: python -m scripts.init_db
      # Seeds demo tenants, users and documents, then checks that nobody can see a document they should not.
      # The script exits non-zero if any check fails, which fails the build.
      - name: Verify access control
        run: python -m scripts.verify_access
      # The live security matrix against a real server. CI has no language model, so rows that need one (chat answers,
      # research reports, saved-answer hiding) are skipped and shown as NOTE; they run locally before a release.
      # Uploads are indexed with the embedding model but without the reviewer model (INSPECT_UPLOADS=false).
      # Any FAIL makes the matrix exit non-zero, which fails the build.
      - name: Security matrix (rows that need no language model)
        env:
          INSPECT_UPLOADS: "false"
        run: |
          python -m scripts.seed_demo
          uvicorn app.main:app --port 8000 > server.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8000/health > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/health
          python -m scripts.security_matrix --no-model --report security-matrix-ci.md
      - name: Keep the matrix report and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-matrix-ci
          path: |
            security-matrix-ci.md
            server.log
          if-no-files-found: ignore

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
